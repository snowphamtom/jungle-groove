<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jungle Groove — Dance Party</title>
<style>
:root{--cream:#fefae0;--gold:#e9c46a;--panel:rgba(12,28,22,.94);--night:#071410}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:var(--night);color:var(--cream);touch-action:manipulation;user-select:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);z-index:20;pointer-events:none}
header>*{pointer-events:auto}
.logo{font-weight:800;letter-spacing:.06em;font-size:13px;color:var(--gold)}.logo small{display:block;font-weight:500;font-size:9px;letter-spacing:.14em;color:#8fbfa3}
.chip{background:var(--panel);border:1px solid rgba(233,196,106,.3);border-radius:999px;padding:5px 10px;font-size:11px}
.mode-toggle{display:flex;border-radius:999px;overflow:hidden;border:1px solid rgba(233,196,106,.4)}
.mode-toggle button{border:0;background:transparent;color:#8fbfa3;padding:6px 11px;font:700 11px/1 inherit;cursor:pointer;min-height:34px}
.mode-toggle button.on{background:var(--gold);color:#1a140e}
#stage{position:relative;overflow:hidden;background:linear-gradient(180deg,#0a1a14 0%,#1b4332 55%,#2d6a4f 100%);transition:background .8s ease}
#stage[data-light=party]{background:linear-gradient(180deg,#12081a 0%,#1b4332 45%,#2d6a4f 100%)}
#stage[data-light=sunset]{background:linear-gradient(180deg,#2b1508 0%,#7a3e12 40%,#2d6a4f 100%)}
#stage[data-light=moon]{background:linear-gradient(180deg,#050b18 0%,#0d2137 50%,#1b4332 100%)}
#stage[data-light=neon]{background:linear-gradient(180deg,#1a0530 0%,#3d1a5c 40%,#0f3d2e 100%)}
#stage[data-light=day]{background:linear-gradient(180deg,#4a7c59 0%,#74a57a 40%,#2d6a4f 100%)}
.vines{position:absolute;inset:0;pointer-events:none;opacity:.9;background-image:radial-gradient(circle at 6% 16%,rgba(45,106,79,.6) 0 48px,transparent 49px),radial-gradient(circle at 94% 20%,rgba(45,106,79,.55) 0 56px,transparent 57px),radial-gradient(circle at 10% 85%,rgba(27,67,50,.7) 0 70px,transparent 71px),radial-gradient(circle at 90% 80%,rgba(27,67,50,.6) 0 62px,transparent 63px)}
.floor{position:absolute;left:3%;right:3%;bottom:5%;height:50%;border-radius:50% 50% 0 0/30% 30% 0 0;background:radial-gradient(ellipse at 50% 25%,rgba(244,162,97,.2),transparent 60%),linear-gradient(180deg,#40916c 0%,#1b4332 100%);box-shadow:0 0 50px rgba(233,196,106,.12),inset 0 10px 24px rgba(0,0,0,.3)}
.disco{position:absolute;left:50%;top:4%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:conic-gradient(#ff6b6b,#feca57,#48dbfb,#ff9ff3,#1dd1a1,#ff6b6b);box-shadow:0 0 30px rgba(255,255,255,.5);animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.beams{position:absolute;inset:0;pointer-events:none;opacity:.35;background:linear-gradient(115deg,transparent 40%,rgba(255,100,180,.25) 50%,transparent 60%),linear-gradient(65deg,transparent 35%,rgba(100,200,255,.2) 48%,transparent 58%);animation:beamShift 7s ease-in-out infinite alternate;mix-blend-mode:screen}
#stage[data-light=moon] .beams{opacity:.15}#stage[data-light=day] .beams{opacity:.08}#stage[data-light=neon] .beams{opacity:.55}
@keyframes beamShift{from{transform:translateX(-4%) rotate(-2deg)}to{transform:translateX(4%) rotate(2deg)}}
.spotlight{position:absolute;left:50%;top:5%;width:140%;height:75%;margin-left:-70%;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.14),transparent 55%);pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.cast{position:absolute;left:0;right:0;bottom:8%;top:20%;pointer-events:none}
.char{position:absolute;width:90px;height:124px;margin-left:-45px;margin-top:-62px;cursor:default;pointer-events:none;transition:filter .15s}
.interact .char{pointer-events:auto;cursor:pointer}
.char.selected{filter:drop-shadow(0 0 14px var(--gold))}
.char .body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.char .emoji{font-size:54px;line-height:1;will-change:transform;transform-origin:50% 80%}
.char .name{margin-top:2px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--cream);text-shadow:0 1px 4px rgba(0,0,0,.8);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:999px}
.char .outfit-tag{position:absolute;top:0;right:0;font-size:17px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.char .bubble{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
.char .bubble.show{opacity:1}
.char.dancing .emoji{animation:bounce var(--beat,.5s) ease-in-out infinite}
.char.dancing[data-style=sway] .emoji{animation:sway var(--beat,.5s) ease-in-out infinite}
.char.dancing[data-style=spin] .emoji{animation:spinDance calc(var(--beat,.5s)*2) linear infinite}
.char.dancing[data-style=hop] .emoji{animation:hop var(--beat,.5s) ease-in-out infinite}
.char.dancing[data-style=wave] .emoji{animation:wave var(--beat,.5s) ease-in-out infinite}
.char.dancing.held .emoji{animation:none!important}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}25%{transform:translateY(-13px) rotate(4deg) scale(1.06)}50%{transform:translateY(-2px) rotate(-3deg)}75%{transform:translateY(-15px) rotate(5deg) scale(1.07)}}
@keyframes sway{0%,100%{transform:translateX(0) rotate(-10deg)}50%{transform:translateX(12px) rotate(10deg)}}
@keyframes spinDance{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.06)}100%{transform:rotate(360deg) scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-18px) scale(1.06,.94)}55%{transform:translateY(-18px) scale(.94,1.06)}}
@keyframes wave{0%,100%{transform:rotate(-12deg) translateY(0)}33%{transform:rotate(8deg) translateY(-8px)}66%{transform:rotate(-6deg) translateY(-4px)}}
.banner{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:rgba(0,0,0,.5);border:1px solid rgba(233,196,106,.25);padding:6px 14px;border-radius:999px;font-size:11px;letter-spacing:.07em;color:#8fbfa3;pointer-events:none;z-index:12;transition:opacity .4s}
.banner.hide{opacity:0}
nav{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:9px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid rgba(233,196,106,.22);z-index:30}
.btn{border:0;border-radius:13px;padding:9px 12px;font:700 12px/1.2 inherit;color:#1a140e;background:var(--gold);cursor:pointer;min-height:42px}
.btn.secondary{background:#40916c;color:var(--cream)}.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(254,250,224,.28)}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:54%;background:var(--panel);border-radius:18px 18px 0 0;border:1px solid rgba(233,196,106,.28);border-bottom:0;padding:12px 12px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom));z-index:40;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:auto}
.sheet.open{transform:translateY(0)}
.sheet h2{margin:0 0 8px;font-size:14px;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.sheet .close{position:absolute;top:8px;right:10px;background:transparent;border:0;color:var(--cream);font-size:22px;cursor:pointer;min-width:42px;min-height:42px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.tile{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:24px}
.tile span{font-size:9px;font-weight:600;color:#c5d9cc}.tile.on{border-color:var(--gold);background:rgba(233,196,106,.16)}
.list{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid transparent;cursor:pointer}
.row.on{border-color:var(--gold);background:rgba(233,196,106,.14)}
.row .meta{flex:1}.row .meta strong{display:block;font-size:13px}.row .meta small{color:#8fbfa3;font-size:11px}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo">JUNGLE GROOVE<small>LIVING DANCE PARTY</small></div>
<div class="mode-toggle">
<button type="button" id="btnWatch" class="on">WATCH</button>
<button type="button" id="btnInteract">INTERACT</button>
</div>
<div class="chip" id="trackChip">♪ Groove Safari</div>
</header>
<div id="stage" data-light="party">
<div class="vines"></div><div class="beams"></div><div class="disco"></div><div class="spotlight"></div><div class="floor"></div>
<div class="banner" id="banner">PARTY IS LIVE — sit back or tap INTERACT</div>
<div class="cast" id="cast"></div>
</div>
<nav>
<button class="btn" id="btnDress" type="button" disabled>👗 Costumes</button>
<button class="btn secondary" id="btnMusic" type="button">🎵 Music</button>
<button class="btn secondary" id="btnLights" type="button">💡 Lights</button>
<button class="btn ghost" id="btnMute" type="button">🔇 Mute</button>
</nav>
</div>
<div class="sheet" id="dressSheet">
<button class="close" id="closeDress" type="button">×</button>
<h2>Costume · <span id="dressName">—</span></h2>
<p style="margin:0 0 8px;font-size:12px;color:#8fbfa3">Party keeps going. You’re just changing the look.</p>
<div class="grid" id="outfitGrid"></div>
</div>
<div class="sheet" id="musicSheet">
<button class="close" id="closeMusic" type="button">×</button>
<h2>Playlist</h2>
<p style="margin:0 0 8px;font-size:12px;color:#8fbfa3">Change the beat — dancers follow the tempo</p>
<div class="list" id="trackList"></div>
</div>
<div class="sheet" id="lightSheet">
<button class="close" id="closeLights" type="button">×</button>
<h2>Lighting</h2>
<p style="margin:0 0 8px;font-size:12px;color:#8fbfa3">Set the mood. Party never stops.</p>
<div class="list" id="lightList"></div>
</div>
<script>
const ANIMALS=[{id:"leo",name:"Leo",base:"🦁",outfit:"cape",style:"bounce",x:.26,y:.52},{id:"zara",name:"Zara",base:"🦓",outfit:"shades",style:"sway",x:.4,y:.6},{id:"momo",name:"Momo",base:"🐵",outfit:"disco",style:"hop",x:.54,y:.48},{id:"pip",name:"Pip",base:"🦜",outfit:"crown",style:"spin",x:.68,y:.56},{id:"tiko",name:"Tiko",base:"🐯",outfit:"tuxedo",style:"wave",x:.34,y:.72},{id:"nala",name:"Nala",base:"🦒",outfit:"hula",style:"sway",x:.62,y:.7}];
const OUTFITS=[{id:"natural",label:"Natural",icon:"🌿"},{id:"tuxedo",label:"Tuxedo",icon:"🎩"},{id:"hula",label:"Hula",icon:"🌺"},{id:"shades",label:"Shades",icon:"🕶️"},{id:"cape",label:"Cape",icon:"🦸"},{id:"disco",label:"Disco",icon:"✨"},{id:"rain",label:"Rain",icon:"🌧️"},{id:"crown",label:"Crown",icon:"👑"},{id:"chef",label:"Chef",icon:"🍳"},{id:"space",label:"Astro",icon:"🚀"}];
function makeMelody(m){const r={major:[0,2,4,5,7,9,11,12],bright:[0,2,4,7,9,12,14,16],soft:[0,3,5,7,10,12,15,17],hype:[0,2,3,5,7,8,10,12],warm:[0,2,5,7,9,12,14,17]};return{scale:r[m]||r.major}}
const TRACKS=[{id:"safari",name:"Groove Safari",bpm:112,tag:"Afrobeat bounce",bars:makeMelody("major")},{id:"bamboo",name:"Bamboo Bounce",bpm:128,tag:"Upbeat pop",bars:makeMelody("bright")},{id:"moon",name:"Moonlit Mambo",bpm:96,tag:"Smooth night",bars:makeMelody("soft")},{id:"stampede",name:"Stampede Drop",bpm:140,tag:"Wild energy",bars:makeMelody("hype")},{id:"river",name:"River Rhythm",bpm:104,tag:"Laid-back groove",bars:makeMelody("warm")}];
const LIGHTS=[{id:"party",name:"Party Canopy",tag:"Classic jungle club"},{id:"sunset",name:"Sunset Glow",tag:"Warm amber hour"},{id:"moon",name:"Moonlit Grove",tag:"Cool night blue"},{id:"neon",name:"Neon Vine",tag:"Electric after-hours"},{id:"day",name:"Daylight",tag:"Bright canopy sun"}];
const BUBBLES=["✨","🎉","💃","🕺","⭐","🔥","🎶","💛","🌴","🪩"],STYLES=["bounce","sway","spin","hop","wave"];
const state={outfits:Object.fromEntries(ANIMALS.map(a=>[a.id,a.outfit])),pos:Object.fromEntries(ANIMALS.map(a=>[a.id,{x:a.x,y:a.y}])),styles:Object.fromEntries(ANIMALS.map(a=>[a.id,a.style])),selected:null,track:TRACKS[0],light:"party",muted:false,mode:"watch",holding:null};
const castEl=document.getElementById("cast"),stageEl=document.getElementById("stage");
function outfitIcon(id){const o=OUTFITS.find(x=>x.id===id);return o&&o.id!=="natural"?o.icon:""}
function renderCast(){const beat=(60/state.track.bpm)+"s";castEl.innerHTML="";ANIMALS.forEach(function(a){const p=state.pos[a.id],div=document.createElement("div");div.className="char dancing"+(state.selected===a.id?" selected":"");div.dataset.id=a.id;div.dataset.style=state.styles[a.id];div.style.setProperty("--beat",beat);div.style.left=(p.x*100)+"%";div.style.top=(p.y*100)+"%";div.innerHTML='<div class="bubble" data-bubble></div><div class="body"><div class="outfit-tag">'+outfitIcon(state.outfits[a.id])+'</div><div class="emoji">'+a.base+'</div><div class="name">'+a.name+'</div></div>';if(state.mode==="interact"){div.addEventListener("pointerdown",function(e){e.preventDefault();state.holding=a.id;state.selected=a.id;div.classList.add("held","selected");Array.prototype.forEach.call(castEl.children,function(c){if(c!==div)c.classList.remove("selected")});document.getElementById("dressName").textContent=a.name});div.addEventListener("pointerup",function(){releaseHold(div)});div.addEventListener("pointerleave",function(){releaseHold(div)});div.addEventListener("pointercancel",function(){releaseHold(div)})}castEl.appendChild(div)})}
function releaseHold(div){state.holding=null;if(div)div.classList.remove("held")}
function partyTick(){ANIMALS.forEach(function(a){if(state.holding===a.id)return;const p=state.pos[a.id];p.x+=(Math.random()-.5)*.014;p.y+=(Math.random()-.5)*.011;p.x=Math.max(.16,Math.min(.84,p.x));p.y=Math.max(.4,Math.min(.84,p.y))});if(Math.random()<.4){const a=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];if(state.holding!==a.id)state.styles[a.id]=STYLES[Math.floor(Math.random()*STYLES.length)]}if(Math.random()<.45){const nodes=castEl.querySelectorAll(".char");if(nodes.length){const n=nodes[Math.floor(Math.random()*nodes.length)],b=n.querySelector("[data-bubble]");if(b){b.textContent=BUBBLES[Math.floor(Math.random()*BUBBLES.length)];b.classList.add("show");setTimeout(function(){b.classList.remove("show")},1e3)}}}renderCast()}
setInterval(partyTick,1400);
const dressSheet=document.getElementById("dressSheet"),musicSheet=document.getElementById("musicSheet"),lightSheet=document.getElementById("lightSheet"),outfitGrid=document.getElementById("outfitGrid"),trackList=document.getElementById("trackList"),lightList=document.getElementById("lightList");
function openSheet(el){dressSheet.classList.remove("open");musicSheet.classList.remove("open");lightSheet.classList.remove("open");el.classList.add("open")}
function closeSheets(){dressSheet.classList.remove("open");musicSheet.classList.remove("open");lightSheet.classList.remove("open")}
function renderOutfits(){outfitGrid.innerHTML="";OUTFITS.forEach(function(o){const t=document.createElement("button");t.type="button";t.className="tile"+(state.selected&&state.outfits[state.selected]===o.id?" on":"");t.innerHTML=o.icon+"<span>"+o.label+"</span>";t.addEventListener("click",function(){if(!state.selected)state.selected=ANIMALS[0].id;state.outfits[state.selected]=o.id;renderOutfits();renderCast()});outfitGrid.appendChild(t)})}
function renderTracks(){trackList.innerHTML="";TRACKS.forEach(function(tr){const row=document.createElement("button");row.type="button";row.className="row"+(state.track.id===tr.id?" on":"");row.innerHTML='<div style="font-size:20px">🎵</div><div class="meta"><strong>'+tr.name+'</strong><small>'+tr.tag+' · '+tr.bpm+' BPM</small></div>';row.addEventListener("click",function(){state.track=tr;document.getElementById("trackChip").textContent="♪ "+tr.name;renderTracks();renderCast();restartMusic()});trackList.appendChild(row)})}
function renderLights(){lightList.innerHTML="";LIGHTS.forEach(function(L){const row=document.createElement("button");row.type="button";row.className="row"+(state.light===L.id?" on":"");row.innerHTML='<div style="font-size:20px">💡</div><div class="meta"><strong>'+L.name+'</strong><small>'+L.tag+'</small></div>';row.addEventListener("click",function(){state.light=L.id;stageEl.setAttribute("data-light",L.id);renderLights()});lightList.appendChild(row)})}
class PartyAudio{constructor(){this.ctx=null;this.timer=null;this.step=0;this.playing=false}ensure(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext);if(this.ctx.state==="suspended")this.ctx.resume()}stop(){this.playing=false;if(this.timer){clearInterval(this.timer);this.timer=null}}start(track){this.ensure();this.stop();if(state.muted)return;this.playing=true;const interval=60/track.bpm*1e3/2,scale=track.bars.scale,base=110,self=this;this.step=0;this.timer=setInterval(function(){if(!self.playing||state.muted)return;const t=self.ctx.currentTime,degree=scale[self.step%scale.length],freq=base*Math.pow(2,degree/12);if(self.step%4===0)self.hit(t,60,.08,"square",.11);if(self.step%4===2)self.noise(t,.05,.05);if(self.step%2===0)self.hit(t,freq,.11,"triangle",.045);if(self.step%8===6)self.hit(t,freq*2,.06,"sine",.03);self.step++},interval)}hit(t,freq,dur,type,gain){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur+.02)}noise(t,dur,gain){const n=this.ctx.createBufferSource(),buf=this.ctx.createBuffer(1,this.ctx.sampleRate*dur,this.ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.5;n.buffer=buf;const g=this.ctx.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(g);g.connect(this.ctx.destination);n.start(t)}}
const audio=new PartyAudio();
function restartMusic(){if(!state.muted)audio.start(state.track);else audio.stop()}
function setMode(mode){state.mode=mode;document.getElementById("btnWatch").classList.toggle("on",mode==="watch");document.getElementById("btnInteract").classList.toggle("on",mode==="interact");document.getElementById("btnDress").disabled=mode!=="interact";document.getElementById("banner").classList.toggle("hide",mode==="interact");stageEl.classList.toggle("interact",mode==="interact");if(mode==="watch"){state.selected=null;state.holding=null;closeSheets()}renderCast()}
document.getElementById("btnWatch").addEventListener("click",function(){setMode("watch")});
document.getElementById("btnInteract").addEventListener("click",function(){setMode("interact")});
document.getElementById("btnDress").addEventListener("click",function(){if(state.mode!=="interact")return;if(!state.selected)state.selected=ANIMALS[0].id;const a=ANIMALS.find(x=>x.id===state.selected);document.getElementById("dressName").textContent=a?a.name:"—";renderOutfits();openSheet(dressSheet)});
document.getElementById("btnMusic").addEventListener("click",function(){renderTracks();openSheet(musicSheet)});
document.getElementById("btnLights").addEventListener("click",function(){renderLights();openSheet(lightSheet)});
document.getElementById("closeDress").addEventListener("click",closeSheets);
document.getElementById("closeMusic").addEventListener("click",closeSheets);
document.getElementById("closeLights").addEventListener("click",closeSheets);
document.getElementById("btnMute").addEventListener("click",function(){state.muted=!state.muted;document.getElementById("btnMute").textContent=state.muted?"🔊 Unmute":"🔇 Mute";restartMusic()});
function bootAudio(){audio.ensure();if(!audio.playing&&!state.muted)audio.start(state.track)}
document.body.addEventListener("pointerdown",bootAudio,{once:true});
setTimeout(function(){try{bootAudio()}catch(e){}},200);
renderCast();renderOutfits();renderTracks();renderLights();setMode("watch");
</script>
</body>
</html>
